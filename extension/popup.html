<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Cleanup Agent</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
    }
    .badge.connected {
      background: #10b981;
    }
    .status-box {
      background: #1e293b;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
      border: 1px solid #334155;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-row:last-child {
      margin-bottom: 0;
    }
    .status-label {
      color: #94a3b8;
    }
    .btn {
      width: 100%;
      padding: 9px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.15s ease;
    }
    .btn-primary {
      background: #0284c7;
      color: #fff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-action {
      background: #f59e0b;
      color: #0f172a;
    }
    .btn-action:hover {
      background: #d97706;
    }
    .btn-loop {
      background: #059669;
      color: #fff;
    }
    .btn-loop:hover {
      background: #047857;
    }
    .btn-danger {
      background: #dc2626;
      color: #fff;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .output-log {
      max-height: 100px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      background: #090d16;
      border-radius: 6px;
      padding: 8px;
      color: #38bdf8;
      border: 1px solid #1e293b;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>
    <span id="bridge-dot" class="badge"></span>
    ChatGPT Cleanup Agent
  </h2>

  <div class="status-box">
    <div class="status-row">
      <span class="status-label">Local Bridge:</span>
      <span id="bridge-status">Checking...</span>
    </div>
    <div class="status-row">
      <span class="status-label">Target Page:</span>
      <span id="tab-status">Scanning...</span>
    </div>
  </div>

  <button id="btn-scan" class="btn btn-primary">🔍 Inspect & Scan Page</button>
  <button id="btn-loop" class="btn btn-loop">🔁 Start Auto Loop (Random 6-9)</button>
  <button id="btn-batch" class="btn btn-action">🗑️ Delete 1 Batch (Random 6-9)</button>
  <button id="btn-stop" class="btn btn-danger">⛔ Emergency Stop</button>
  <button id="btn-reset" class="btn btn-secondary">🔄 Reset Stop Flag</button>

  <div id="log" class="output-log">Ready. Connect Python bridge to start.</div>

  <script src="popup.js"></script>
</body>
</html>
